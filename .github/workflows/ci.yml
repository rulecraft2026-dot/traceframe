name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Python tests
        shell: bash
        run: |
          if [ -d backend/tests ] && find backend/tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            PYTHONPATH=backend pytest backend/tests -q
          else
            echo "No Python tests found under backend/tests; skipping pytest."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker build -t traceframe:test .
      - run: docker build -f Dockerfile.web -t traceframe-web:test .
