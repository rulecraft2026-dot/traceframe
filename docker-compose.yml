services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - traceframe-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  traceframe-data:
